<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>controls</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .ctrl-wrap {
    position: absolute;
    inset: 6px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ctrl-btn {
    appearance: none;
    border: 1px solid rgba(245, 224, 190, 0.35);
    background: rgba(22, 17, 14, 0.88);
    color: #f4ede2;
    font-family: 'Be Vietnam Pro', -apple-system, sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .ctrl-btn:hover { background: rgba(44, 33, 26, 0.96); transform: translateY(-1px); }
</style>
</head>
<body>
<div class="ctrl-wrap">
  <button class="ctrl-btn" id="c-skip">Mở bức thư ngay</button>
  <button class="ctrl-btn" id="c-quit">Đóng ✕</button>
</div>
<script src="js/host.js"></script>
<script>
  document.getElementById('c-skip').onclick = () => Host.post({ cmd: 'skipPrelude' });
  document.getElementById('c-quit').onclick = () => Host.post({ cmd: 'quit' });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>memory</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<style>
  :root { --pad: 18px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default; }

  .card {
    position: absolute; inset: var(--pad);
    border-radius: 8px;
    padding: 10px 10px 10px 10px;
    background: #f6f0e4;
    box-shadow: 0 22px 46px -10px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 250, 240, 0.4);
    clip-path: circle(0% at 50% 50%);
    animation: birth 1.15s cubic-bezier(.16, 1, .3, 1) forwards, bob 6s ease-in-out 1.2s infinite;
    display: flex;
    flex-direction: column;
  }
  @keyframes birth { to { clip-path: circle(85% at 50% 50%); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }

  .frame {
    position: relative;
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow: hidden;
    border-radius: 3px;
    background: #14110e;
  }

  .media {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform: scale(1.22);
    filter: saturate(0.95) contrast(1.03);
    animation: settle 1.7s cubic-bezier(.16, 1, .3, 1) forwards;
  }
  @keyframes settle { to { transform: scale(1.02); } }

  .flash {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, #fff7e6 0%, #ffd79a 35%, rgba(255, 215, 154, 0) 75%);
    mix-blend-mode: screen; pointer-events: none;
    animation: flash .9s ease-out forwards;
  }
  @keyframes flash { 0% { opacity: 1 } 100% { opacity: 0 } }

  .note {
    flex-shrink: 0;
    padding: 8px 6px 2px;
    font: 400 13.5px/1.3 'Playpen Sans', cursive;
    color: #2b231d;
    text-align: center;
    white-space: normal;
    word-break: break-word;
    opacity: 0; transform: translateY(6px);
    animation: up .85s cubic-bezier(.16, 1, .3, 1) .45s forwards;
  }
  @keyframes up { to { opacity: 1; transform: none; } }

  body.small .card {
    padding: 0;
    border-radius: 10px;
    background: #0b0908;
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.78), 0 0 0 1px rgba(255, 240, 215, 0.22);
  }
  body.small .note { display: none; }

  body.out .card { animation: implode .6s cubic-bezier(.7, 0, .84, 0) forwards; }
  @keyframes implode {
    0% { clip-path: circle(85% at 50% 50%); filter: brightness(1); }
    60% { filter: brightness(2.4); }
    100% { clip-path: circle(0% at 50% 50%); filter: brightness(3.8); }
  }
</style>
</head>
<body>
<div class="card">
  <div class="frame">
    <div id="m"></div>
    <div class="flash"></div>
  </div>
  <div class="note" id="note"></div>
</div>
<script src="js/host.js"></script>
<script>
  const id = Host.q('id', 'x');
  const src = Host.q('src', '');
  const note = Host.q('note', '') || Host.q('title', '');
  const noteEl = document.getElementById('note');
  if (note) {
    noteEl.textContent = note;
  } else {
    noteEl.remove();
  }
  if (Host.q('small', '0') === '1') document.body.classList.add('small');

  const holder = document.getElementById('m');
  if (/\.(mp4|mov|webm|m4v)$/i.test(src)) {
    const v = document.createElement('video');
    Object.assign(v, { src, muted: true, loop: true, autoplay: true, playsInline: true });
    v.className = 'media';
    holder.replaceWith(v);
    v.play().catch(() => {});
  } else if (src) {
    const img = new Image();
    img.src = src; img.className = 'media';
    holder.replaceWith(img);
  }

  window.ACT = (name) => {
    if (name === 'implode') {
      document.body.classList.add('out');
      setTimeout(() => {
        const v = document.querySelector('video');
        if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
        Host.post({ cmd: 'close', id });
      }, 640);
    }
  };
</script>
</body>
</html>
